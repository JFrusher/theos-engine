name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc, cxx: g++ }
          # Clang 19 is the first Clang whose concepts level unlocks std::expected in libstdc++ 13
          - { cc: clang, cxx: clang++-19 }
    name: linux-${{ matrix.compiler.cc }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 19
        if: matrix.compiler.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang-19
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 19
        run: sudo apt-get update && sudo apt-get install -y clang-19 libclang-rt-19-dev
      - name: Build fuzzers
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++-19 -DTHEOS_FUZZ=ON -DTHEOS_BUILD_TESTS=OFF
          cmake --build build
      - name: Fuzz the binary decoder (60 s)
        run: ./build/fuzz/decode_fuzzer -max_total_time=60 -max_len=8192 fuzz/corpus/decode
      - name: Fuzz the parser (60 s)
        run: ./build/fuzz/parse_fuzzer -max_total_time=60 -max_len=8192 fuzz/corpus/parse

  windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
