name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y z3
      - name: Build and test
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          cmake --install build --prefix "theos-${GITHUB_REF_NAME}-linux-x86_64"
          tar czf "theos-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" "theos-${GITHUB_REF_NAME}-linux-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: theos-*.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-z3
            git
            zip
      - name: Build and test
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          cmake --install build --prefix "theos-${GITHUB_REF_NAME}-windows-x86_64"
          zip -r "theos-${GITHUB_REF_NAME}-windows-x86_64.zip" "theos-${GITHUB_REF_NAME}-windows-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: theos-*.zip

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Theos $GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
